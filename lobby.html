<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IPRET – Lobby</title>
  <meta name="color-scheme" content="dark" />
  <!-- Pretendard Webfont (CDN) -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <style>
    
  </style>

</head>
<body>
  <main class="stage">
    <div class="center" aria-label="IPRET Lobby">
      <h1>IPRET</h1>
      <p class="sub">complement of QPI</p>
    </div>
  </main>
  <script>
document.addEventListener("keydown", function(event) {
  // H와 Q 키가 동시에 눌렸는지 확인
  if (event.key.toUpperCase() === "Q" && event.ctrlKey && event.altKey) {
    // Ctrl+Alt+Q -> index.html 이동
    window.location.href = "index.html";
  } else if (event.key.toUpperCase() === "H") {
    // H 키만 눌렸을 때는 아무 동작 안 하고,
    // 다음 입력 기다림
    window.lastKey = "H";
    setTimeout(() => { window.lastKey = null; }, 500); // 0.5초 내에 Q가 눌려야 동작
  } else if (event.key.toUpperCase() === "Q" && window.lastKey === "H") {
    // 직전에 H가 눌리고 Q가 이어지면 index.html 이동
    window.location.href = "index.html";
  }
});
</script>

</body>
</html>
