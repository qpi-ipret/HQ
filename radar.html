<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>IPRET RADAR – Satellite Tracker</title>
<meta name="color-scheme" content="dark" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  
</style>
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <aside class="side">
    <h1>IPRET RADAR</h1>

    <div class="block">
      <div class="label">Search Satellite</div>
      <div class="search-wrap">
        <input id="satSearch" class="search-input" list="satList" placeholder="e.g. STARLINK / NOAA / METEOR" autocomplete="off" />
        <datalist id="satList"></datalist>
      </div>
    </div>

    <div class="block">
      <div class="label">Select AOI (Area of Interest)</div>
      <ul class="regions" id="regionList"></ul>
    </div>

    <div class="block">
      <div class="label">Group Filters</div>
      <div class="filters" id="groupFilters">
        <label class="filter-row"><input type="checkbox" data-group="STARLINK" checked> STARLINK</label>
        <label class="filter-row"><input type="checkbox" data-group="WEATHER"  checked> WEATHER</label>
        <label class="filter-row"><input type="checkbox" data-group="OTHER"    checked> OTHER</label>
      </div>
    </div>

    <div class="block">
      <div class="label">Display</div>
      <div class="toggles">
        <label class="filter-row"><input type="checkbox" id="toggleTrails" checked> Orbit trails (20 min)</label>
        <label class="filter-row"><input type="checkbox" id="toggleFoot"   checked> Footprint</label>
      </div>
    </div>

    <div class="stat" id="stats">
      <div class="row"><span>Region:</span><b id="stat-region">-</b></div>
      <div class="row"><span>Satellites (shown):</span><b id="stat-count">0</b></div>
      <div class="row"><span>Update:</span><b id="stat-upd">-</b></div>
    </div>
  </aside>

  <!-- Map -->
  <main id="map">
    <div class="sweep" aria-hidden="true"></div>
    <div class="brand-left">IPRET RADAR</div>
    <div class="brand-right">QPI</div>
    <div class="chips">
      <div class="chip">TLE: CelesTrak</div>
      <div class="chip">Canvas</div>
      <div class="chip blink">LIVE</div>
    </div>
    <div class="status" id="status">STATUS: <b>booting…</b></div>
    <div class="attribution">© OpenStreetMap contributors, © CARTO</div>
  </main>
</div>

</body>
</html>
