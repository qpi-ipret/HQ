<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ACCESS GATE</title>
  <meta name="color-scheme" content="dark" />
  <style>
    /* ===== Base ===== */
    :root {
      --bg: #000;
      --red: #ff2b2b;
      --red-dim: #c01414;
      --scanline: rgba(255, 43, 43, 0.05);
      --glow: 0 0 .6rem #ff2b2b, 0 0 1.2rem #ff2b2b;
      --neon: 0 0 .35rem #ff2b2b, 0 0 .8rem #ff4545, 0 0 1.8rem #ff6a6a;
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      background: var(--bg);
      margin: 0;
      color: var(--red);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      letter-spacing: .04em;
      overflow: hidden; /* 레이더/스캔라인 연출 유지 */
    }

    /* ===== Center Stage ===== */
    .stage {
      position: relative;
      height: 100%;
      display: grid;
      place-items: center;
      isolation: isolate;
    }

    /* 스캔라인 + 약한 노이즈 레이어 */
    .stage::before,
    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .stage::before {
      /* 수평 스캔라인 */
      background:
        repeating-linear-gradient(
          to bottom,
          transparent 0px,
          transparent 2px,
          var(--scanline) 2px,
          var(--scanline) 3px
        );
      mix-blend-mode: screen;
      animation: scanShift 8s linear infinite;
    }
    .stage::after {
      /* 아주 약한 필름 그레인 */
      background-image: radial-gradient(circle at 10% 10%, rgba(255,255,255,.05) 0 2px, transparent 3px),
                        radial-gradient(circle at 80% 60%, rgba(255,255,255,.03) 0 2px, transparent 3px);
      background-size: 120px 120px, 200px 200px;
      opacity: .25;
      animation: grain 5s steps(6) infinite;
    }

    @keyframes scanShift { to { transform: translateY(-3px); } }
    @keyframes grain { to { transform: translate(2px, -2px); } }

    /* ===== Access Panel ===== */
    .panel {
      position: relative;
      z-index: 1;
      width: min(88vw, 700px);
      aspect-ratio: 16 / 9;
      display: grid;
      place-items: center;
      border: 3px solid var(--red);
      border-radius: 14px;
      box-shadow: inset 0 0 0 2px rgba(255, 43, 43, .25), var(--neon);
      background:
        radial-gradient(1200px 600px at 50% 0%, rgba(255, 0, 0, .06), transparent 60%),
        linear-gradient(to bottom right, rgba(255,0,0,.03), transparent 40% 60%, rgba(255,0,0,.03));
      overflow: hidden;
    }

    /* 사이버 감성 장식 라인 */
    /*
    .panel::before {
      content: "";
      position: absolute;
      inset: 12px;
      border: 1px dashed rgba(255, 43, 43, .35);
      border-radius: 10px;
      mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite: xor; 
      mask-composite: exclude;     
      pointer-events: none;
    }
/*
    /* 코너 브래킷 */
    .corner {
      position: absolute;
      width: 36px; height: 36px;
      border: 3px solid var(--red);
      filter: drop-shadow(0 0 .3rem #ff2b2b);
    }
    .tl { inset: -2px auto auto -2px; border-right: none; border-bottom: none; border-radius: 12px 0 0 0; }
    .tr { inset: -2px -2px auto auto; border-left:  none; border-bottom: none; border-radius: 0 12px 0 0; }
    .bl { inset: auto auto -2px -2px; border-right: none; border-top:    none; border-radius: 0 0 0 12px; }
    .br { inset: auto -2px -2px auto; border-left:  none; border-top:    none; border-radius: 0 0 12px 0; }

    /* ===== Text ===== */
    .title {
      font-size: clamp(28px, 6vw, 64px);
      color: var(--red);
      text-shadow: var(--glow);
      letter-spacing: .18em;
      text-transform: uppercase;
      user-select: none;
      animation: flicker 3.5s infinite;
    }

    /* 작은 상태 텍스트 */
    .sub {
      position: absolute;
      bottom: 10px;
      left: 16px;
      font-size: 12px;
      color: var(--red-dim);
      opacity: .85;
      text-shadow: 0 0 .4rem rgba(255, 43, 43, .45);
      user-select: none;
    }
/*
    @keyframes flicker {
      0%, 19%, 21%, 23%, 100% { opacity: 1; filter: drop-shadow(0 0 .6rem #ff2b2b); }
      20%, 22% { opacity: .7; filter: drop-shadow(0 0 .2rem #ff2b2b); }
      55% { opacity: .95; }
      56% { opacity: .5; }
      57% { opacity: .92; }
    }

    /* 접근성용 스크린리더 텍스트 숨김 */
    .sr-only {
      position: absolute !important;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0);
      white-space: nowrap; border: 0;
    }
  </style>
</head>
<body>
  <div class="stage" aria-live="polite">
    <div class="panel" role="region" aria-label="Access Control Panel">
      <div class="corner tl" aria-hidden="true"></div>
      <div class="corner tr" aria-hidden="true"></div>
      <div class="corner bl" aria-hidden="true"></div>
      <div class="corner br" aria-hidden="true"></div>

      <h1 class="title" id="denied-text">ACCESS DENIED</h1>
      <p class="sub">[SYS] Awaiting input… <span aria-hidden="true">▌</span></p>

      <span class="sr-only">
        Type "access" or press Space, Backspace, Enter to proceed to the lobby.
      </span>
    </div>
  </div>

  <script>
    // ===== Key Sequence Logic =====
    (function () {
      const redirect = () => {
        // 부드러운 효과를 주고 이동
        document.getElementById('denied-text').textContent = 'ACCESS GRANTED';
        setTimeout(() => { window.location.href = 'lobby.html'; }, 220);
      };

      // 1) "access" 문자열 감지 (대소문자 무시, 최근 16자 버퍼)
      const targetWord = 'access';
      let typedBuffer = '';

      // 2) Space → Backspace → Enter 시퀀스 감지
      const combo = ['Space', 'Backspace', 'Enter'];
      let comboIndex = 0;
      let comboTimer = null;
      const comboTimeoutMs = 30000; // 3초 내에 연속 입력 필요

      const resetCombo = () => {
        comboIndex = 0;
        if (comboTimer) {
          clearTimeout(comboTimer);
          comboTimer = null;
        }
      };

      window.addEventListener('keydown', (e) => {
        // Backspace가 브라우저 뒤로가기를 막도록
        if (e.key === 'Backspace') e.preventDefault();

        // ===== 문자열 버퍼 업데이트 =====
        const isChar = e.key.length === 1; // 단일 문자
        if (isChar) {
          typedBuffer += e.key.toLowerCase();
          if (typedBuffer.length > 16) typedBuffer = typedBuffer.slice(-16);
          if (typedBuffer.includes(targetWord)) {
            redirect();
            return;
          }
        }

        // ===== 콤보 시퀀스 체크 (Space → Backspace → Enter) =====
        if (e.code === combo[comboIndex] || e.key === combo[comboIndex]) {
          // 첫 입력이면 타이머 시작
          if (comboIndex === 0 && !comboTimer) {
            comboTimer = setTimeout(resetCombo, comboTimeoutMs);
          }
          comboIndex++;
          if (comboIndex >= combo.length) {
            resetCombo();
            redirect();
            return;
          }
        } else {
          // 다른 키가 들어오면 콤보 진행 중이던 것도 리셋
          resetCombo();
          // 단, 다음 키가 Space로 시작하면 즉시 시작 가능하도록 처리는 위에서 자동
        }
      }, { capture: true }); // capture로 전역 우선 처리
    })();
  </script>
</body>
</html>
